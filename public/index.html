<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame Capture</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section class="movie-generator">
            <h2>Generate Movie List</h2>
            <form id="movie-form">
                <label for="host-name">Your Name</label>
                <input
                    type="text",
                    id="host-name",
                    placeholder="Enter your name",
                    required
                >
                <label for="movie-prompt">Genre, Collection or Custom Request</label>
                <input
                    type="text"
                    id="movie-prompt"
                    placeholder="e.g. Marvel movies or Science fiction"
                    required
                >
                <label for="movie-count">Number of Rounds</label>
                <input
                    type="number"
                    id="movie-count"
                    min="1"
                    max="30"
                    value="10"
                    required
                >
                <button type="submit">Generate Movies</button>
            </form>
            <div id="movie-results"></div>
        </section>


        <h1>Video Frame Capture</h1>
        <p class="description">
            Search for a video and capture a frame at a specific timestamp.
        </p>
        <form id="capture-form">
            <label for="search-query">
                Video Search Query
            </label>
            <input
                type="text"
                id="search-query"
                placeholder="e.g. The Avengers"
                required
            >
            <label for="movie-year">Movie Year</label>
            <input type="number" id="movie-year" placeholder="e.g. 2012" required>
            <label for="timestamp">
                Timestamp
            </label>
            <input
                type="text"
                id="timestamp"
                placeholder="e.g. 02:35"
                required
            >
            <button type="submit">
                Capture Frame
            </button>
        </form>
        <section id="result" class="result hidden">
            <h2>Captured Frame</h2>
            <img id="screenshot" src="" alt="Captured video frame">
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
